<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Galaxy</title>
<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#000;
}
canvas{
    display:block;
}
#text{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    color:white;
    font-family:Arial;
    letter-spacing:4px;
    pointer-events:none;
    opacity:.8;
}
</style>
</head>
<body>

<div id="text">Move Mouse • Scroll to Zoom</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 18;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const stars = 35000;

const geometry = new THREE.BufferGeometry();

const positions = [];
const colors = [];

const color = new THREE.Color();

for(let i=0;i<stars;i++){

    const radius=Math.random()*10;

    const angle=radius*5;

    const branch=(i%5)*(Math.PI*2/5);

    const spin=radius*0.6;

    const random=Math.pow(Math.random(),2)*1.2;

    const x=Math.cos(angle+branch+spin)*radius+(Math.random()-0.5)*random;
    const y=(Math.random()-0.5)*0.6;
    const z=Math.sin(angle+branch+spin)*radius+(Math.random()-0.5)*random;

    positions.push(x,y,z);

    color.setHSL(0.55-radius/25,1,.65);

    colors.push(color.r,color.g,color.b);
}

geometry.setAttribute(
'position',
new THREE.Float32BufferAttribute(positions,3)
);

geometry.setAttribute(
'color',
new THREE.Float32BufferAttribute(colors,3)
);

const material=new THREE.PointsMaterial({
size:0.05,
vertexColors:true,
transparent:true,
opacity:0.95,
depthWrite:false
});

const galaxy=new THREE.Points(geometry,material);

scene.add(galaxy);

let mouseX=0;
let mouseY=0;
let zoom=18;

window.addEventListener("mousemove",e=>{
mouseX=(e.clientX/window.innerWidth-.5)*2;
mouseY=(e.clientY/window.innerHeight-.5)*2;
});

window.addEventListener("wheel",e=>{
zoom+=e.deltaY*0.01;
zoom=Math.max(8,Math.min(40,zoom));
});

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

function animate(){

requestAnimationFrame(animate);

galaxy.rotation.y+=0.0015;
galaxy.rotation.x+=0.0004;

galaxy.rotation.y+=mouseX*0.001;
galaxy.rotation.x+=mouseY*0.001;

camera.position.z+=(zoom-camera.position.z)*0.05;

renderer.render(scene,camera);

}

animate();

</script>

</body>
</html>
